##################################
# Deployment
##################################

# Pod Config
replicaCount: 2
# Allow more than the application shutdown timeout of 60 seconds.
terminationGracePeriodSeconds: 75

# Container Config
image:
  tag: ""

# Container Ports Config
ports:
  - name: http
    containerPort: 8082
    protocol: TCP

# Environment Config
env:
  - name: SERVER_PORT
    value: "8082"
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: TZ
    value: "Asia/Seoul"

##################################
# Ingress
##################################
ingress:
  className: traefik-prod
