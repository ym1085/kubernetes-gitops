##################################
# Deployment
##################################

# Container Config
image:
  tag: ""

# Container Ports Config
ports:
  - name: http
    containerPort: 8081
    protocol: TCP

# Environment Config
env:
  - name: SERVER_PORT
    value: "8081"
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: TZ
    value: "Asia/Seoul"

##################################
# Ingress
##################################
ingress:
  className: traefik-dev
  paths:
    - /api/v1
    - /images
