##################################
# Deployment
##################################

# Container Config
image:
  tag: ""

# Container Ports Config
ports:
  - name: http
    containerPort: 8081
    protocol: TCP

# Environment Config
# The API has no stg profile; use dev with a separate namespace.
env:
  - name: SERVER_PORT
    value: "8081"
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: TZ
    value: "Asia/Seoul"

##################################
# Ingress
##################################
ingress:
  className: traefik-stg
  paths:
    - /api/v1
    - /images
