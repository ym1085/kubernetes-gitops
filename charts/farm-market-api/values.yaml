##################################
# Deployment
##################################

# Pod Config
replicaCount: 1
terminationGracePeriodSeconds: 45

# Container Config
containerName: farm-market-api
image:
  # Set the published repository and an immutable release tag before deployment.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Container Ports Config
ports:
  - name: http
    containerPort: 8080
    protocol: TCP

# Environment Config
# Set the complete environment list in values-{env}.yaml.
env: []

# Pod Health Checks
# TCP checks the listener only; use HTTP probes when health endpoints are available.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 2

readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  timeoutSeconds: 2

livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 2

# Pod Resources Config
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

##################################
# Service
##################################
service:
  port: 80

##################################
# Ingress
##################################
ingress:
  # Enable or disable Ingress creation.
  enabled: true
  className: ""
  host: ""
  paths:
    - /api/v1
  tls: []
