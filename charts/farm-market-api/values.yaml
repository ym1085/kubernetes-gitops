##################################
# Deployment: spec.replicas
##################################
replicaCount: 1

##################################
# Deployment: spec.template.spec
##################################
imagePullSecrets: []
terminationGracePeriodSeconds: 45

##################################
# Deployment: spec.template.spec.containers[]
##################################
image:
  # Set the published repository and an immutable release tag before deployment.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

springProfile: ""
containerPort: 8080
env:
  - name: FARMMARKET_IMAGE_STORAGELOCATION
    value: "file:/data/uploads/"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# shortcut: TCP only checks the listener; use HTTP probes when the API exposes health endpoints.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 30
  timeoutSeconds: 2
readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 2

##################################
# Service: spec
##################################
service:
  port: 80

##################################
# Ingress: spec (enabled는 리소스 생성 여부)
##################################
ingress:
  enabled: true
  className: ""
  host: ""
  paths:
    - /api/v1
  tls: []
