apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: farm-market-api-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: farm-market-stg
  source:
    repoURL: https://github.com/ym1085/sandbox-k8s-gitops.git
    targetRevision: stg
    path: charts/farm-market-api
    helm:
      releaseName: farm-market-api
      valueFiles:
        - values-stg.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: farm-market-stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
