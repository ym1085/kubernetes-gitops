name: Validate GitOps

on:
  pull_request:
  push:
    branches: [dev, stg, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/gitops-venv"
          "$RUNNER_TEMP/gitops-venv/bin/pip" install PyYAML==6.0.1
          echo "$RUNNER_TEMP/gitops-venv/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --remote-name https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 --remote-name https://get.helm.sh/helm-v4.1.1-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v4.1.1-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.1.1-linux-amd64.tar.gz
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Validate declarations and all charts
        run: python3 scripts/gitops/validate.py --fixtures --external-charts
      - name: Test chart contracts and scripts
        run: python3 -m unittest discover -s tests -v
      - name: Check all shell script syntax
        run: |
          for script in scripts/gitops/argocd/*.sh scripts/k8s/kind-cluster/*.sh scripts/aws/eks/*.sh scripts/aws/eks/aws-load-balancer-controller/*.sh; do
            bash -n "$script"
          done
